<!DOCTYPE html>
<html>
<head>
    <title>Login to Posa</title>
    <style>
        body {
            text-align: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at center, #1a1a1a, #000000);
            color: #e0e0e0;
        }

        h1 {
            color: #00bcd4;
            text-shadow: 2px 2px 8px #000;
        }

        h3 {
            color: #b0bec5;
        }

        img {
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.5);
        }

        form {
            margin-top: 20px;
            font-size: 20px;
            color: #e0e0e0;
        }

        input[type="text"], input[type="password"] {
            background-color: #2c2c2c;
            border: 1px solid #555;
            color: #ffb6c1;
            padding: 10px;
            border-radius: 5px;
        }

        input[type="submit"] {
            background-color: #00bcd4;
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        input[type="submit"]:hover {
            background-color: #0097a7;
        }

        p#error {
            color: #ff5252;
            font-weight: bold;
        }

        .announcement {
            display: none;
            background-color: #ff9800;
            color: #000;
            padding: 15px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 5px;
            margin: 20px auto;
            width: 60%;
            box-shadow: 0 0 10px rgba(255, 152, 0, 0.7);
        }
    </style>
    <script>
        function validateLogin(event) {
            event.preventDefault();

            let username = document.getElementById("username").value.trim();
            let password = document.getElementById("password").value.trim();

            if (username === "posanioleva" && password === "neelia") {
                let announcement = document.getElementById("announcement");
                announcement.style.display = "block";

                setTimeout(() => {
                    window.location.href = "posa.html";
                }, 2000);
            } 
            else if (username === "bahobaho" && password === "nicktoothbrushka") {
                let announcement = document.getElementById("announcement");
                announcement.style.display = "block";

                setTimeout(() => {
                    window.location.href = "nick.html";
                }, 2000);
            } 
            else {
                document.getElementById("error").textContent = "BALIKTARIN MO LANG FIRST NAME NI ANES NYAHAHAHA.";
            }
        }

        function togglePassword() {
            let passwordInput = document.getElementById("password");
            passwordInput.type = (passwordInput.type === "password") ? "text" : "password";
        }
    </script>
</head>
<body>
    <h1>Login to Posa!</h1>
    <img src="posa.png" alt="img" width="150px">
    <h3>Login to redirect to our portal</h3>

    <div id="announcement" class="announcement">
        ⚠️ HIII, ATEN LANG TU HA NYAAHAHAAHAHAHA
    </div>

    <form onsubmit="validateLogin(event)">
        <input type="text" id="username" name="username" required minlength="3" maxlength="13" placeholder="Username" size="40">
        <br>
        <input type="password" id="password" name="password" required minlength="3" maxlength="7" placeholder="Password" size="40">
        <br>
        <input type="submit" value="Login">
        <input type="checkbox" onclick="togglePassword()"> Show Password
    </form>
    <p id="error"></p>
</body>
</html>
